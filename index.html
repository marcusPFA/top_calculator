<!DOCTYPE html>
<html lang="en">
    <head charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="body">
            <div id="display"></div>
            <div id="keypad">
                    <div id="plus" class="operation key">+</div>
                    <div id="minus" class="operation key">-</div>
                    <div class="operation key">x</div>
                    <div class="operation key">%</div>
                    <div id="numpad">
                    <div class="number key">1</div>
                    <div class="number key">2</div>
                    <div class="number key">3</div>
                    <div class="number key">4</div>
                    <div class="number key">5</div>
                    <div class="number key">6</div>
                    <div class="number key">7</div>
                    <div class="number key">8</div>
                    <div class="number key">9</div>
                    <div id="backspace" class="operation key">&lt;</div>
                    <div class="number key">0</div>
                    <div id="equal" class="operation key">=</div>
                    </div>

            </div>
        </div>
        <script src="javascript.js" defer></script>
    </body>
</html>
