<!DOCTYPE html>
<html lang="en">
    <head charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="body">
            <div id="display"></div>
            <div id="keypad">
                    <div id="plus" class="operator key">+</div>
                    <div id="minus" class="operator key">-</div>
                    <div class="operator key">x</div>
                    <div class="operator key">%</div>
                    <div class="number key">1</div>
                    <div class="number key">2</div>
                    <div class="number key">3</div>
                    <div class="operator key">mod</div>
                    <div class="number key">4</div>
                    <div class="number key">5</div>
                    <div class="number key">6</div>
                    <div class="operator key">^</div>
                    <div class="number key">7</div>
                    <div class="number key">8</div>
                    <div class="number key">9</div>
                    <div id="point" class="function key">.</div>
                    <div id="backspace" class="function key">&lt;</div>
                    <div class="number key">0</div>
                    <div id="equal" class="function key">=</div>
                    <div id="clear" class="function key">clear</div>
            </div>
        </div>
        <script src="javascript.js" defer></script>
    </body>
</html>
